model = "gpt-6.1-sol"
service_tier = "fast"
model_reasoning_effort = "high"

[tui]
theme = "dracula"
animations = false
notifications = false
show_tooltips = false
status_line = ["model-with-reasoning", "context-used", "total-input-tokens", "total-output-tokens"]
screen_reader_detection_done = true

[feedback]
enabled = false

[features]
hooks = false
memories = false

[[skills.config]]
name = "skill-creator"
enabled = false

[[skills.config]]
name = "skill-installer"
enabled = false

[[skills.config]]
name = "plugin-creator"
enabled = false

[mcp_servers.chrome-devtools]
command = "bunx"
args = ["chrome-devtools-mcp@latest", "--headless", "--viewport=1920x1080"]
enabled = false
default_tools_approval_mode = "approve"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[notice]
hide_rate_limit_model_nudge = true
fast_default_opt_out = true

[realtime]
voice = "sol"

